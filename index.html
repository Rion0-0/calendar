<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kis-My Reminder</title>
 <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>

<div class="app">

  <header class="top">
    <h1>🎀 Kis-My Calendar</h1>
    <a class="add-link" href="add.html">＋ 予定追加</a>
  </header>

  <div class="quick">
    <b>📌 クイックアクセス</b><br>
    <a href="https://www.fc-member.familyclub.jp/" target="_blank">FCログイン</a>
    <a href="https://starto.jp/" target="_blank">STARTO</a>
    <a href="https://mentrecording.jp/kismyft2/" target="_blank">MENT</a>
    <a href="https://tver.jp/" target="_blank">TVer</a>
  </div>

  <div class="member-toggle-card">
    <b>表示するメンバー</b>
    <div id="memberToggleArea" class="member-toggle-area"></div>
  </div>

  <section class="calendar-card">
    <div class="calendar-header">
      <button id="prevMonth">←</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth">→</button>
    </div>

    <div class="week-row">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>

    <div id="calendar" class="calendar"></div>
  </section>

  <h2 id="selectedDateTitle">選択日の予定</h2>
  <div id="selectedList"></div>

  <h2>🔥 今日やること</h2>
  <div id="todayList"></div>
  
<a href="add.html" class="fab">＋</a>
  
</div>

<script type="module" src="script.js"></script>
</body>
</html>
