<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予定追加</title>

  <link rel="stylesheet" href="./style.css?v=999" />
</head>

<body>

<div class="app">

  <header class="top">
    <h1>＋ 予定追加</h1>

    <a class="add-link" href="./index.html">
      ← カレンダーへ
    </a>
  </header>

  <div class="template-area">

    <button
      type="button"
      class="template-btn"
      data-template="tv"
    >
      📺 TV
    </button>

    <button
      type="button"
      class="template-btn"
      data-template="tver"
    >
      📱 TVer期限
    </button>

    <button
      type="button"
      class="template-btn"
      data-template="live"
    >
      🎤 ライブ
    </button>

    <button
      type="button"
      class="template-btn"
      data-template="payment"
    >
      💸 入金期限
    </button>

    <button
      type="button"
      class="template-btn"
      data-template="result"
    >
      🎯 当落
    </button>

    <button
      type="button"
      class="template-btn"
      data-template="magazine"
    >
      📚 雑誌
    </button>

  </div>

  <form id="addForm" class="form">

    <input
      id="title"
      type="text"
      placeholder="タイトル"
      required
    />

    <div class="row">

      <input
        id="date"
        type="date"
        required
      />

      <input
        id="time"
        type="time"
      />

    </div>

    <div class="row">

      <select id="member"></select>

      <select id="kind"></select>

    </div>

    <div class="row">

      <select id="category"></select>

      <select id="priority"></select>

    </div>

    <select id="repeat"></select>

    <select id="repeatWeekday">

      <option value="">
        曜日指定なし
      </option>

      <option value="0">
        毎週日曜
      </option>

      <option value="1">
        毎週月曜
      </option>

      <option value="2">
        毎週火曜
      </option>

      <option value="3">
        毎週水曜
      </option>

      <option value="4">
        毎週木曜
      </option>

      <option value="5">
        毎週金曜
      </option>

      <option value="6">
        毎週土曜
      </option>

    </select>

    <textarea
      id="memo"
      placeholder="メモ"
    ></textarea>

    <input
      id="url"
      type="url"
      placeholder="公式サイトURL"
    />

    <button
      id="addBtn"
      type="submit"
    >
      追加
    </button>

  </form>

</div>

<script
  type="module"
  src="./add.js?v=999"
></script>

</body>
</html>
